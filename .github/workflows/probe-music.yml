name: probe-music

# مؤقت: بيفحص تراكات ملكية عامة (CC0) مرشّحة على archive.org عن طريق
# الـ metadata API (أوثق من advancedsearch اللي بيرجع أخطاء متقطعة)
# ويجيب أسماء الملفات القابلة للتحميل فعلياً. هيتشال بعد ما نختار.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: كتابة سكريبت فحص الملفات
        run: |
          printf '%s\n' \
            'import json, sys' \
            'd = json.load(open(sys.argv[1]))' \
            'for f in d.get("files", []):' \
            '    if f.get("name", "").lower().endswith(".mp3"):' \
            '        print(f.get("name"), f.get("size"), f.get("length"))' \
            > list_mp3s.py
          cat list_mp3s.py

      - name: فحص مرشّحين CC0 معروفين عن طريق metadata API
        run: |
          set +e
          ids="irish-instrumental-music TwiceUpon venetian-moon duck-music Komiku-Poupis_incredible_adventures fabled-black-rider-st-lp SyntheticSoundsKOWSSantaRosa Cortexelation"
          for id in $ids; do
            echo "########## metadata: $id ##########"
            curl -sSL --max-time 30 "https://archive.org/metadata/$id" -o "meta_${id}.json" -w "HTTP:%{http_code} SIZE:%{size_download}\n"
            echo "--- license ---"
            grep -oE '"licenseurl":"[^"]*"' "meta_${id}.json" | head -1
            echo "--- mp3 files (name size length) ---"
            python3 list_mp3s.py "meta_${id}.json"
          done
