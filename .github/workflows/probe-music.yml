name: probe-music

# مؤقت: بيكتشف لينكات تراكات موسيقى ملكية عامة (CC0) حقيقية ومناسبة
# (طاقة/سينمائي) من archive.org، وبيتأكد من أسماء الملفات القابلة للتحميل.
# الساندبوكس بيوصل GitHub بس، فالـ runner (عنده نت كامل) هو اللي بيدوّر.
# هيتشال بعد ما نختار التراكات.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: بحث بسيط عن صوت CC0 (نفس الاستعلام اللي اشتغل قبل كده)
        run: |
          set +e
          curl -sSL --max-time 40 \
            "https://archive.org/advancedsearch.php?q=mediatype%3Aaudio+AND+licenseurl%3A%28*publicdomain%2Fzero*%29+AND+subject%3A%28instrumental%29&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=downloads&sort%5B%5D=downloads+desc&rows=60&output=json" \
            -o q_instrumental.json -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          cat q_instrumental.json
          echo

      - name: كتابة سكريبتات الفحص
        run: |
          printf '%s\n' \
            'import json, sys' \
            'd = json.load(open(sys.argv[1]))' \
            'for f in d.get("files", []):' \
            '    if f.get("name", "").lower().endswith(".mp3"):' \
            '        print(f.get("name"), f.get("size"), f.get("length"))' \
            > list_mp3s.py
          printf '%s\n' \
            'import json' \
            'd = json.load(open("q_instrumental.json"))' \
            'docs = d.get("response", {}).get("docs", [])' \
            'for x in docs[:10]:' \
            '    print(x.get("identifier"))' \
            > top_ids.py
          cat list_mp3s.py
          cat top_ids.py

      - name: تفاصيل الملفات لأفضل مرشحين (الأعلى تحميلاً)
        run: |
          set +e
          ids=$(python3 top_ids.py 2>&1)
          echo "candidate ids: $ids"
          for id in $ids; do
            echo "########## metadata: $id ##########"
            curl -sSL --max-time 30 "https://archive.org/metadata/$id" -o "meta_${id}.json" -w "HTTP:%{http_code}\n"
            echo "--- mp3 files (name size length) ---"
            python3 list_mp3s.py "meta_${id}.json"
          done
