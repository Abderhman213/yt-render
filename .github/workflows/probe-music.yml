name: probe-music

# مؤقت: بيكتشف لينكات تراكات موسيقى ملكية عامة (Public Domain) حقيقية.
# الساندبوكس بيوصل GitHub بس، فالـ runner (عنده نت كامل) هو اللي بيدوّر.
# هيتشال بعد ما نختار التراكات.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: FreePD الهيكل الحقيقي للصفحة
        run: |
          set +e
          curl -sSL --max-time 40 -A "Mozilla/5.0" https://freepd.com/ -o root.html -w "ROOT HTTP:%{http_code} SIZE:%{size_download}\n"
          echo "########## FULL root.html ##########"
          cat root.html
          echo "########## any .mp3 anywhere ##########"
          grep -oiE 'https?://[^"'\''<> ]*\.mp3' root.html | sort -u
          grep -oiE '[a-z0-9_./%-]*\.mp3' root.html | sort -u | head -40
          echo "########## audio/source tags ##########"
          grep -oiE '<(audio|source)[^>]*>' root.html | head -20

      - name: archive.org بحث عن موسيقى ملكية عامة
        run: |
          set +e
          echo "########## advancedsearch: public domain audio ##########"
          curl -sSL --max-time 40 \
            "https://archive.org/advancedsearch.php?q=mediatype%3Aaudio+AND+licenseurl%3A%28*publicdomain*%29+AND+subject%3A%28instrumental%29&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=licenseurl&rows=25&output=json" \
            -o s1.json -w "HTTP:%{http_code}\n"
          cat s1.json | head -c 4000; echo
          echo "########## advancedsearch: FreeMusicArchive CC0 / netlabel ##########"
          curl -sSL --max-time 40 \
            "https://archive.org/advancedsearch.php?q=collection%3Anetlabels+AND+mediatype%3Aaudio+AND+format%3A%28VBR+MP3%29&fl%5B%5D=identifier&fl%5B%5D=title&rows=15&output=json" \
            -o s2.json -w "HTTP:%{http_code}\n"
          cat s2.json | head -c 2500; echo
