name: probe-music

# مؤقت: بيكتشف لينكات تراكات موسيقى ملكية عامة (CC0) حقيقية ومناسبة
# (طاقة/سينمائي) من archive.org، وبيتأكد من أسماء الملفات القابلة للتحميل.
# الساندبوكس بيوصل GitHub بس، فالـ runner (عنده نت كامل) هو اللي بيدوّر.
# هيتشال بعد ما نختار التراكات.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: بحث مُوجّه لتراكات CC0 طاقة/سينمائية
        run: |
          set +e
          for kw in "epic" "cinematic" "upbeat" "energetic" "background+music"; do
            echo "########## query: $kw ##########"
            curl -sSL --max-time 30 \
              "https://archive.org/advancedsearch.php?q=mediatype%3Aaudio+AND+licenseurl%3A%28*publicdomain%2Fzero*%29+AND+title%3A%28${kw}%29&fl%5B%5D=identifier&fl%5B%5D=title&rows=8&output=json" \
              -o "q_${kw}.json" -w "HTTP:%{http_code}\n"
            cat "q_${kw}.json"
            echo
          done

      - name: كتابة سكريبت فحص الملفات
        run: |
          printf '%s\n' \
            'import json, sys' \
            'd = json.load(open(sys.argv[1]))' \
            'for f in d.get("files", []):' \
            '    if f.get("name", "").lower().endswith(".mp3"):' \
            '        print(f.get("name"), f.get("size"), f.get("length"))' \
            > list_mp3s.py
          cat list_mp3s.py

      - name: تفاصيل الملفات لأفضل مرشحين
        run: |
          set +e
          ids=$(cat q_*.json | grep -oE '"identifier":"[^"]*"' | sed 's/"identifier":"//;s/"$//' | sort -u | head -6)
          echo "candidate ids: $ids"
          for id in $ids; do
            echo "########## metadata: $id ##########"
            curl -sSL --max-time 30 "https://archive.org/metadata/$id" -o "meta_${id}.json" -w "HTTP:%{http_code}\n"
            echo "--- mp3 files (name size length) ---"
            python3 list_mp3s.py "meta_${id}.json"
          done
