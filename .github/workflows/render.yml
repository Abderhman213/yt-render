name: render-and-upload

# n8n بيشغّل الـ workflow ده عن طريق workflow_dispatch ويبعتله الـ payload.
# GitHub Actions هي اللي بتقوم بدور السيرفر: ffmpeg والتعليق الصوتي والرفع.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON فيه lines و clips و title و description و tags"
        required: true
        type: string
      channel:
        description: "القناة: سيبها فاضية للإنجليزية، أو es/bw/gen/states/college/crime"
        required: false
        default: ""
        type: string

# الرندر تقيل، فمش عايزين تشغيلتين يركبوا على بعض — بس كل قناة في طابور لوحدها
concurrency:
  group: render-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: تثبيت ffmpeg
        # مش متثبّت على صور الرنر الجديدة، فبنثبّته كل مرة (حوالي ٢٠ ثانية)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            edge-tts \
            google-api-python-client \
            google-auth

      - name: كتابة الـ payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$PAYLOAD" > payload.json
          python -c "import json;d=json.load(open('payload.json'));print('جمل:',len(d['lines']),'| لقطات:',len(d['clips']))"

      - name: الرندر
        run: python scripts/render.py payload.json

      - name: تحديد بادئة أسرار القناة
        # كل قناة جديدة ليها بادئة أسرار مختلفة (YT_<PREFIX>_CLIENT_ID وهكذا)،
        # ولازم تكون على مشروع Google Cloud تاني عشان حصة الرفع اليومية
        # بتتحسب على المشروع مش على القناة.
        id: chan
        run: |
          case "${{ inputs.channel }}" in
            es) echo "prefix=YT_ES" >> "$GITHUB_OUTPUT"; echo "n8n_prefix=N8N_ES" >> "$GITHUB_OUTPUT" ;;
            bw) echo "prefix=YT_BW" >> "$GITHUB_OUTPUT"; echo "n8n_prefix=N8N_BW" >> "$GITHUB_OUTPUT" ;;
            gen) echo "prefix=YT_GEN" >> "$GITHUB_OUTPUT"; echo "n8n_prefix=N8N_GEN" >> "$GITHUB_OUTPUT" ;;
            states) echo "prefix=YT_STATES" >> "$GITHUB_OUTPUT"; echo "n8n_prefix=N8N_STATES" >> "$GITHUB_OUTPUT" ;;
            college) echo "prefix=YT_COLLEGE" >> "$GITHUB_OUTPUT"; echo "n8n_prefix=N8N_COLLEGE" >> "$GITHUB_OUTPUT" ;;
            crime) echo "prefix=YT_CRIME" >> "$GITHUB_OUTPUT"; echo "n8n_prefix=N8N_CRIME" >> "$GITHUB_OUTPUT" ;;
            *) echo "prefix=YT" >> "$GITHUB_OUTPUT"; echo "n8n_prefix=N8N" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: الرفع على يوتيوب
        id: upload
        env:
          YT_CLIENT_ID: ${{ secrets[format('{0}_CLIENT_ID', steps.chan.outputs.prefix)] }}
          YT_CLIENT_SECRET: ${{ secrets[format('{0}_CLIENT_SECRET', steps.chan.outputs.prefix)] }}
          YT_REFRESH_TOKEN: ${{ secrets[format('{0}_REFRESH_TOKEN', steps.chan.outputs.prefix)] }}
        run: python scripts/upload.py

      - name: إبلاغ n8n بالنتيجة
        if: always()
        env:
          N8N_CALLBACK_URL: ${{ secrets[format('{0}_CALLBACK_URL', steps.chan.outputs.n8n_prefix)] }}
        run: python scripts/callback.py

      - name: حفظ الفيديو لو الرفع فشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output.mp4
          retention-days: 3
          if-no-files-found: ignore
