name: render-and-upload

# factory.yml بيشغّل الـ workflow ده عن طريق workflow_dispatch ويبعتله الـ payload
# (زي ما n8n كان بيعمل قبل كده). هنا ffmpeg والتعليق الصوتي والرفع.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON فيه lines و clips و title و description و tags"
        required: true
        type: string
      channel:
        description: "القناة: سيبها فاضية للإنجليزية، أو es/bw/gen/states/college/crime"
        required: false
        default: ""
        type: string

# الرندر تقيل، فمش عايزين تشغيلتين يركبوا على بعض — بس كل قناة في طابور لوحدها
concurrency:
  group: render-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: تثبيت ffmpeg
        # مش متثبّت على صور الرنر الجديدة، فبنثبّته كل مرة (حوالي ٢٠ ثانية)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            edge-tts \
            google-api-python-client \
            google-auth \
            requests

      - name: كتابة الـ payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$PAYLOAD" > payload.json
          python -c "import json;d=json.load(open('payload.json'));print('جمل:',len(d['lines']),'| لقطات:',len(d['clips']))"

      - name: الرندر
        run: python scripts/render.py payload.json

      - name: تحديد بادئة أسرار القناة
        # كل قناة جديدة ليها بادئة أسرار مختلفة (YT_<PREFIX>_CLIENT_ID وهكذا)،
        # ولازم تكون على مشروع Google Cloud تاني عشان حصة الرفع اليومية
        # بتتحسب على المشروع مش على القناة.
        id: chan
        run: |
          case "${{ inputs.channel }}" in
            es) echo "prefix=YT_ES" >> "$GITHUB_OUTPUT" ;;
            bw) echo "prefix=YT_BW" >> "$GITHUB_OUTPUT" ;;
            gen) echo "prefix=YT_GEN" >> "$GITHUB_OUTPUT" ;;
            states) echo "prefix=YT_STATES" >> "$GITHUB_OUTPUT" ;;
            college) echo "prefix=YT_COLLEGE" >> "$GITHUB_OUTPUT" ;;
            crime) echo "prefix=YT_CRIME" >> "$GITHUB_OUTPUT" ;;
            fc) echo "prefix=YT_FC" >> "$GITHUB_OUTPUT" ;;
            goat) echo "prefix=YT_GOAT" >> "$GITHUB_OUTPUT" ;;
            ref) echo "prefix=YT_REF" >> "$GITHUB_OUTPUT" ;;
            money) echo "prefix=YT_MONEY" >> "$GITHUB_OUTPUT" ;;
            future) echo "prefix=YT_FUTURE" >> "$GITHUB_OUTPUT" ;;
            hist) echo "prefix=YT_HIST" >> "$GITHUB_OUTPUT" ;;
            *) echo "prefix=YT" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: الرفع على يوتيوب
        id: upload
        env:
          YT_CLIENT_ID: ${{ secrets[format('{0}_CLIENT_ID', steps.chan.outputs.prefix)] }}
          YT_CLIENT_SECRET: ${{ secrets[format('{0}_CLIENT_SECRET', steps.chan.outputs.prefix)] }}
          YT_REFRESH_TOKEN: ${{ secrets[format('{0}_REFRESH_TOKEN', steps.chan.outputs.prefix)] }}
        run: python scripts/upload.py

      - name: إبلاغ النتيجة (الشيت + تليجرام)
        # بديل وركفلوهات n8n "استقبال نتيجة الرندر": بيحدّث صف الفكرة ويبعت إشعار
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python factory/report.py "${{ inputs.channel }}"

      - name: حفظ الفيديو لو الرفع فشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output.mp4
          retention-days: 3
          if-no-files-found: ignore
