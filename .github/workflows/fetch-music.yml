name: fetch-music

# بيحمّل تراكات موسيقى ملكية عامة (CC0) مُتحقّق منها من archive.org
# ويضيفها للمستودع تحت assets/music/. الساندبوكس مايقدرش يوصل
# archive.org، فده بيشتغل ع الـ runner اللي عنده نت كامل ويعمل كوميت.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: تحميل تراكات إضافية بمزاجات متنوعة (كل واحد CC0 موثّق)
        run: |
          set -e
          mkdir -p assets/music
          cd assets/music

          # حماسي/مبهج — مناسب لحقائق ممتعة وخفيفة
          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/Komiku-Poupis_incredible_adventures/Komiku_-_20_-_SUPER_POUPI.mp3" \
            -o "07-super-poupi.mp3" -w "7 HTTP:%{http_code} SIZE:%{size_download}\n"

          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/Komiku-Poupis_incredible_adventures/Komiku_-_16_-_Disco_Cat.mp3" \
            -o "08-disco-cat.mp3" -w "8 HTTP:%{http_code} SIZE:%{size_download}\n"

          # هادي/دافئ — مناسب لسرد هادي أو نهايات
          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/Komiku-Poupis_incredible_adventures/Komiku_-_56_-_Tea_with_Granma.mp3" \
            -o "09-tea-with-granma.mp3" -w "9 HTTP:%{http_code} SIZE:%{size_download}\n"

          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/Komiku-Poupis_incredible_adventures/Komiku_-_50_-_Chillin_Poupi.mp3" \
            -o "10-chillin-poupi.mp3" -w "10 HTTP:%{http_code} SIZE:%{size_download}\n"

          # غامض/متوتر — مناسب لحوادث/سكاندلات/جدل
          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/fabled-black-rider-st-lp/Fabled%20Black%20Rider%20-%20FABLED%20BLACK%20RIDER%20-Fabled%20Black%20Rider-%20-%2002%20Caves%20Pitch-Black%20But%20For%20The%20Glow%20Of%20Goblin-Blades.mp3" \
            -o "11-dark-caves.mp3" -w "11 HTTP:%{http_code} SIZE:%{size_download}\n"

          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/fabled-black-rider-st-lp/Fabled%20Black%20Rider%20-%20FABLED%20BLACK%20RIDER%20-Fabled%20Black%20Rider-%20-%2009%20Descending%20Into%20The%20Chambers%20Beneath%20The%20Old%20Reliquary.mp3" \
            -o "12-dark-chambers.mp3" -w "12 HTTP:%{http_code} SIZE:%{size_download}\n"

          # ملحمي/درامي — مناسب لقصص كبيرة/سجلات
          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/fabled-black-rider-st-lp/Fabled%20Black%20Rider%20-%20FABLED%20BLACK%20RIDER%20-Fabled%20Black%20Rider-%20-%2006%20Making%20A%20Fire%20On%20The%20Battle-Meadow.mp3" \
            -o "13-epic-battle-meadow.mp3" -w "13 HTTP:%{http_code} SIZE:%{size_download}\n"

          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/fabled-black-rider-st-lp/Fabled%20Black%20Rider%20-%20FABLED%20BLACK%20RIDER%20-Fabled%20Black%20Rider-%20-%2001%20Rumours%20From%20The%20East.mp3" \
            -o "14-epic-rumours.mp3" -w "14 HTTP:%{http_code} SIZE:%{size_download}\n"

          # إلكتروني/تقني — مناسب لعلوم وتكنولوجيا
          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/Cortexelation/cortexelation-02-coronatextile_64kb.mp3" \
            -o "15-electronic-coronatextile.mp3" -w "15 HTTP:%{http_code} SIZE:%{size_download}\n"

          curl -sSL --max-time 60 -A "Mozilla/5.0" \
            "https://archive.org/download/Cortexelation/cortexelation-05-extricateloon_64kb.mp3" \
            -o "16-electronic-extricateloon.mp3" -w "16 HTTP:%{http_code} SIZE:%{size_download}\n"

          echo "--- files ---"
          ls -la
          echo "--- verify each is a real mp3 ---"
          for f in 0[7-9]*.mp3 1[0-6]*.mp3; do file "$f"; done

      - name: التحقق من الرخصة (لازم CC0 لكل مصدر جديد)
        run: |
          set -e
          for id in Komiku-Poupis_incredible_adventures fabled-black-rider-st-lp Cortexelation; do
            lic=$(curl -sSL --max-time 30 "https://archive.org/metadata/$id" | grep -oE '"licenseurl":"[^"]*"' | head -1)
            echo "$id -> $lic"
            case "$lic" in
              # publicdomain/zero = CC0 1.0 (الحديثة)، licenses/publicdomain = CC Public
              # Domain Dedication (نفس المعنى، رابط قديم) — نرفض mark/1.0 (مجرد "علامة"
              # إن العمل عام أصلاً، مش تنازل رسمي من الرافع) وأي حاجة تانية.
              *publicdomain/zero*|*licenses/publicdomain*) echo "OK: CC0/public domain dedication" ;;
              *) echo "FAIL: not CC0 for $id"; exit 1 ;;
            esac
          done

      - name: تحديث ملف المصادر/التراخيص
        run: |
          cat > assets/music/SOURCES.md <<'EOF'
          # مصادر موسيقى الخلفية

          كل التراكات دي Public Domain (CC0 1.0 Universal) من archive.org —
          استخدام تجاري كامل من غير أي احتياج لنسب المصدر (attribution) أو ترخيص.

          راجع manifest.json لمزاج كل تراك (mood tags).

          - 01 إلى 05 و 07 إلى 10:
            Komiku — "Poupi's incredible adventures !" soundtrack
            https://archive.org/details/Komiku-Poupis_incredible_adventures
            License: CC0 1.0 (https://creativecommons.org/publicdomain/zero/1.0/)

          - 06-venetian-moon.mp3:
            "Venetian Moon"
            https://archive.org/details/venetian-moon
            License: CC0 1.0 (https://creativecommons.org/publicdomain/zero/1.0/)

          - 11 و 12 و 13 و 14:
            "Fabled Black Rider" S/T LP
            https://archive.org/details/fabled-black-rider-st-lp
            License: CC0 1.0 (https://creativecommons.org/publicdomain/zero/1.0/)

          - 15 و 16:
            "Cortexelation"
            https://archive.org/details/Cortexelation
            License: CC Public Domain Dedication (http://creativecommons.org/licenses/publicdomain/) — نفس معنى CC0
          EOF
          cat assets/music/SOURCES.md

      - name: كوميت التراكات للمستودع
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/music
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Widen background music library across mood categories (CC0)

          Adds upbeat, calm, dark/tense, epic and electronic tracks — all
          license-verified public domain (CC0) from archive.org — so the
          render pipeline can match music mood to a video's topic instead
          of picking any track at random. See assets/music/SOURCES.md."
            git push
          fi
